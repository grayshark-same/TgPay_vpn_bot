services:
  bot:
    build:
      context: .
      dockerfile: DockerFile
    container_name: fish-vpn-bot
    env_file: .env
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
