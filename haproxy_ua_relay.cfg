global
    log stdout format raw local0
defaults
    mode tcp
    timeout connect 5s
    timeout client 1m
    timeout server 1m

frontend ua_tcp_in
    bind 0.0.0.0:6443
    default_backend ua_tcp_out

backend ua_tcp_out
    server ua_server 130.0.238.163:6443 check

frontend ua_grpc_in
    bind 0.0.0.0:6445
    default_backend ua_grpc_out

backend ua_grpc_out
    server ua_server 130.0.238.163:6445 check
